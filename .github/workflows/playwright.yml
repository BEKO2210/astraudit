name: Visual regression (Phase 4.1)

# Runs the Playwright snapshot suite on every PR + main push. The
# config (playwright.config.ts) builds the site fresh and serves it
# via `vite preview` before each test so the snapshots reflect what
# GitHub Pages will actually deliver.
#
# A first run with no committed baselines fails by design — the
# author commits the CI-generated `__snapshots__/` directory once,
# and subsequent PRs are checked against it. The workflow uploads
# the diff report as an artefact so reviewers can see exactly which
# pixels changed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Roadmap M1.4 — cancel stale PR runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          # Pinning to the bundled browser version keeps the cache
          # invalidated whenever Playwright's binary moves.
          # The `-fx6.21` suffix forces a one-time re-population when
          # Phase 6.21 added firefox + webkit to the installed set.
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-fx6.21

      - name: Install Playwright browsers
        # Phase 6.21–6.24 — Firefox + WebKit run the cross-browser
        # smoke spec (tests/visual/*.smoke.spec.ts). Mobile Chromium
        # rides on the chromium binary already installed alongside
        # the Pixel 7 device descriptor.
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      # Build separately so the Playwright webServer probe (60s) only
      # has to start `vite preview`, not pack a cold TypeScript +
      # Vite build into its window. Was the root cause of the
      # "Timed out waiting 120000ms from config.webServer" failure.
      - name: Build production bundle
        run: npm run build

      - name: Run visual regression tests
        run: npx playwright test
        env:
          CI: "1"

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
