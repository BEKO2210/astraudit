name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages API + REST API share the installation rate-limit pool.
      # An 8-PR burst in 20 minutes is enough to exhaust it; the
      # deploy step then fails with a 403 + "API rate limit exceeded
      # for installation". Wait up to ~2.5 min for budget to recover
      # before invoking the action — see scripts/wait-for-rate-limit.sh.
      - name: Checkout (for wait-for-rate-limit.sh)
        uses: actions/checkout@v6
      - name: Wait for installation rate-limit budget
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/wait-for-rate-limit.sh

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
