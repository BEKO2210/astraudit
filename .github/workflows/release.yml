name: Release (Phase 6.50)

# Tag-triggered release pipeline. When the maintainer pushes a tag
# like `v1.0.0`, this workflow:
#   1. Re-runs the full quality matrix (typecheck, vitest, bundle
#      budget, audit gate) — so a buggy commit between a green
#      `main` and the tag push can't ship.
#   2. Builds the production dist/ bundle.
#   3. Creates a GitHub Release, attaches `dist.zip` + `public/og-card.png`
#      so consumers can grab the static site without cloning, and
#      auto-generates the release notes body from the merged PR titles
#      since the previous tag.
#
# The deploy workflow (`deploy.yml`) handles GitHub Pages publishing
# on every push to `main`. This workflow is *additive* — it makes the
# tag a stable, attestable artefact, not a deploy mechanism.
#
# The npm-publish step for `astraudit-mcp` (the MCP server) stays a
# manual maintainer step until Phase 6.49 cuts v1.0.0 and the
# package name is reserved on the registry.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re-)release. Must already exist on origin."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Fetch full history so the changelog generator can walk
          # back to the previous tag.
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Bundle-size budget (Phase 6.15)
        run: npm run check:bundle-size

      - name: Dependency audit (Phase 6.37 — production deps only)
        run: npm run check:audit

      - name: Pack release archive
        run: |
          # Zip the built static site so the release page hosts a
          # stable, no-clone-required copy of the deploy.
          cd dist
          zip -r ../astraudit-dist.zip .
          cd ..
          ls -la astraudit-dist.zip

      - name: Compute release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF##refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute dist.zip SHA256 for the release body
        id: hash
        run: |
          SUM=$(sha256sum astraudit-dist.zip | awk '{print $1}')
          echo "sha256=$SUM" >> "$GITHUB_OUTPUT"
          echo "dist sha256: $SUM"

      - name: Extract release-notes body from CHANGELOG.md (curated path)
        id: notes
        run: |
          # Phase 6.50 — release-body strategy. The maintainer writes a
          # curated `## [X.Y.Z]` section in CHANGELOG.md (handled by
          # `npm run release:prep`); this step extracts everything
          # between that heading and the next `## [` heading and uses
          # it as the GitHub Release body. If no matching section is
          # found, the workflow falls back to auto-generated bullets
          # from the merged PR titles since the previous tag — that
          # path still works for patch releases where the maintainer
          # doesn't want to write prose.
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"          # v1.0.0 → 1.0.0
          NOTES_FILE="$(mktemp)"
          # Use awk to extract the section. Greedy: read every line
          # between "## [VERSION]" and the next "## [" (exclusive).
          awk -v ver="$VERSION" '
            BEGIN { capture = 0 }
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && $0 ~ "^## \\[" { capture = 0 }
            capture { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [ -s "$NOTES_FILE" ]; then
            echo "Found curated section for $VERSION in CHANGELOG.md."
            cp "$NOTES_FILE" release-body.md
          else
            echo "No curated section for $VERSION — falling back to PR-title bullets."
            PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
            {
              echo "## Astraudit $TAG"
              echo ""
              if [ -z "$PREV" ]; then
                echo "Initial release. See [CHANGELOG.md](./CHANGELOG.md) for the full build log."
              else
                echo "### Changes since $PREV"
                echo ""
                git log --pretty=format:'- %s' "$PREV..$TAG" | head -50
                echo ""
              fi
            } > release-body.md
          fi

          # Append the verification footer (dist hash + workflow link)
          # to every release so the body is structurally consistent.
          {
            echo ""
            echo "---"
            echo ""
            echo "### Verification"
            echo ""
            echo "- \`astraudit-dist.zip\` SHA-256: \`${{ steps.hash.outputs.sha256 }}\`"
            echo "- Built by [\`release.yml\` @ run #${GITHUB_RUN_NUMBER}](https://github.com/${{ github.repository }}/actions/runs/${GITHUB_RUN_ID})"
            echo "- Constraint contract: [ROADMAP.md → anti-roadmap](https://github.com/${{ github.repository }}/blob/$TAG/ROADMAP.md#anti-roadmap--things-astraudit-will-never-do)"
          } >> release-body.md

          # Multi-line passthrough for actions-output (heredoc form).
          {
            echo "body<<RELEASE_BODY_EOF"
            cat release-body.md
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          files: |
            astraudit-dist.zip
            public/og-card.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
