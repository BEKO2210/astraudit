name: Quality gates (Phase 4.2)

# Two independent gates that run on every PR + main push:
#   1. Lighthouse CI — performance / accessibility / best-practices /
#      SEO scores must clear the floors in `lighthouserc.json`.
#   2. axe-core via Playwright — no `serious` / `critical` WCAG
#      violations on the home page or the legal pages.
#
# These gates are separate from the visual regression workflow
# (`.github/workflows/playwright.yml`) so a flaky snapshot can't mask a
# real accessibility / performance regression.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Roadmap M1.4 — cancel stale PR runs when a contributor force-pushes
# or pushes a follow-up commit. Push-to-main runs always go to a
# unique SHA-based group so historical runs stay intact and the
# required-check signal on `main` never gets cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Bundle-size budget (Phase 6.15)
        # Hard ceiling on the production main chunk and the heavy lazy
        # chunks. Catches a stray eager import before it lands; the
        # ceiling is documented per-budget in the script itself.
        run: npm run check:bundle-size
      - name: Dependency audit (Phase 6.37)
        # Production-deps only at `high` or above. We deliberately don't
        # gate on devDependency vulns because the Lighthouse CI tooling
        # itself ships some high-severity transitive issues that aren't
        # in our user-facing runtime path (puppeteer / tar-fs / ws).
        # If a *production* dep ever ships a high or critical CVE,
        # this gate stops the merge.
        run: npm run check:audit
      - name: Run Lighthouse CI
        # `lhci autorun` reads `lighthouserc.json`, runs the collect +
        # assert + upload steps, and exits non-zero if any assertion
        # fails. The temporary-public-storage upload gives us a
        # clickable link in the workflow log.
        run: npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Build separately so the Playwright webServer probe (60s) only
      # has to start `vite preview`, not pack a cold TypeScript +
      # Vite build into its window. Was the root cause of the
      # "Timed out waiting 120000ms from config.webServer" failure.
      - name: Build production bundle
        run: npm run build
      - name: Run axe-core accessibility tests
        # Filter to the new a11y spec only — visual regression runs in
        # its own workflow.
        run: npx playwright test tests/visual/a11y.spec.ts
        env:
          CI: "1"
      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: a11y-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
